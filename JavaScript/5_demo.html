<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function getdata() {
            var a = document.getElementById("btnGet").innerHTML;
            document.getElementById('ans').innerHTML = a 
        }

        function setdata() {
            document.getElementById("btnGet").innerHTML = "<i> Hello JS </i>";
        }
    </script>
</head>
<body>
    <input type="button" value="Get" onclick="getdata()">
    <input type="button" value="Set" onclick="setdata()">
    <p id ='btnGet'><b>I am  P Tag</b></p>
    <p id ="ans"></p>
</body>
</html>
